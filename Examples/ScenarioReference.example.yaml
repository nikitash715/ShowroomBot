# Справочник: все поддерживаемые типы шагов и их параметры.
# Examples не загружается приложением. Копируйте нужные шаги в Scenarios/*.yaml.
# Задержки, таймауты и интервалы необязательны, кроме seconds у Wait: ниже значения по умолчанию из кода.
# В рабочем сценарии оставляйте только нужные параметры и переопределения.
# Учётные данные вымышленные; заполните их в локальном сценарии.
name: "Справочник шагов" # Название сценария в списке приложения.
steps: # Шаги сценария; выполняются последовательно сверху вниз.
  # Контекст выбирается по type: шаги 1С — RDP, CheckMail — локальный Outlook, Wait — без переключения.
  - type: Open1C # Найти уже открытую базу по цвету панели; если не найдена — запустить новую.
    executable: 'C:\Program Files\1cv8\common\1cestart.exe' # Путь к программе запуска 1С на удалённом компьютере.
    server: 'onec.example.com' # Адрес сервера 1С, на котором размещена база.
    database: 'example_database' # Имя информационной базы на сервере 1С.
    user: 'example_user' # Имя пользователя 1С; пустое значение не добавляет /N в команду запуска.
    password: '' # Пароль пользователя 1С; пустое значение не добавляет /P в команду запуска.
    afterActivationDelayMs: 1000 # Пауза после активации окна RDP, мс, перед поиском базы или запуском 1С.
    afterRunDialogDelayMs: 500 # Пауза после Win+R, мс, перед вводом команды запуска 1С.
    panelColor: '#C0DCC0' # Цвет панели нужной базы в формате #RRGGBB; используется для распознавания окна.
    colorTolerance: 9 # Допустимое отклонение компонентов RGB при поиске цвета панели, 0..32.
    readyTimeoutSeconds: 420 # Максимальное ожидание распознавания интерфейса базы после запуска 1С: 7 минут, с.
    pollIntervalMs: 30000 # Пауза между повторными проверками готовности базы: 30 секунд, мс.
    windowSwitchDelayMs: 700 # Пауза после переключения удалённого окна при поиске открытой базы, мс.
    maxWindowsToCheck: 50 # Максимальное число удалённых окон для поиска открытой базы; затем запускается новая.

  - type: Open1CSection # Открыть раздел в активной базе 1С.
    section: 'Infostart Toolkit' # Название раздела в левой панели.

  - type: Open1CCommand # Открыть раздел, найти и нажать указанную команду.
    section: "Infostart Toolkit" # Название раздела в левой панели 1С, который нужно открыть.
    command: "Консоль запросов" # Название команды в открытом разделе 1С, которую нужно найти и нажать.
    fallbackLink: '' # Ссылка e1c:// для альтернативного открытия этой команды через Shift+F11.
    sectionOpenTimeoutSeconds: 5 # Лимит ожидания перерисовки раздела перед поиском команды, с (1..5); затем поиск продолжается.
    commandTimeoutSeconds: 15 # Максимальное время поиска команды в разделе, с.
    pollIntervalMs: 500 # Интервал повторного поиска команды, мс.

  - type: ExecuteToolkitQuery # Открыть консоль Toolkit, ввести и выполнить запрос, прокрутить результат.
    section: 'Infostart Toolkit' # Раздел консоли; пустое значение использует Infostart Toolkit.
    command: 'Консоль запросов' # Команда консоли; пустое значение использует Консоль запросов.
    sectionOpenTimeoutSeconds: 5 # Ожидание перерисовки раздела, с (1..5).
    commandTimeoutSeconds: 15 # Лимит поиска команды, с.
    queryFile: 'Queries1c/РаспределениеЗапасов.txt' # Путь к текстовому файлу запроса; относительный путь считается от каталога приложения.
    queryInputMode: typing # Способ ввода запроса: typing — набор клавиатурой, paste — вставка через буфер с проверкой текста.
    consoleTimeoutSeconds: 30 # Максимальное ожидание распознавания консоли Toolkit, редактора и кнопки выполнения, с.
    queryInputTimeoutSeconds: 20 # Лимит ввода запроса, с; для typing автоматически увеличивается с учётом длины и темпа набора.
    queryTimeoutSeconds: 120 # Максимальное ожидание подтверждённого завершения нового запроса, с.
    pollIntervalMs: 500 # Пауза между повторными проверками готовности, поиском команды или проверками результата, мс.
    scrollSpeed: 5 # Скорость 1..10: для быстрого теста 10, для медленного показа 1; default 5.
    # Скорость задаёт только деления колеса и паузу: 1 = 1/1500 мс, 5 = 2/700 мс, 10 = 10/100 мс.
    maxScrollAttempts: 300 # Защитный максимум отправок колеса; не регулирует скорость.
    scrollTimeoutSeconds: 660 # Общий бюджет прокрутки с учётом RDP/OCR, с; не зависит от скорости.
    scrollUnchangedAttempts: 4 # Остановка после стольких попыток без изменений подряд, минимум 2.
    # Исчерпание числа попыток или времени: успешный шаг с записью о неполной прокрутке.
    resultStablePolls: 3 # Число последовательных стабильных наблюдений результата для подтверждения завершения, минимум 2.

  - type: Wait # Пауза между шагами с поддержкой отмены сценария.
    seconds: 5 # Длительность ожидания в секундах; обязательное положительное целое число.

  - type: CheckMail # Свернуть RDP, открыть локальный Outlook и отправить новые непрочитанные письма в Telegram.
    # Используется открытый Outlook; иначе запускается C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE.
    # Входящие основного профиля; отправитель, тема и текст читаются через COM, без OCR.
    # UnRead не меняется. Уже отправленные StoreID + EntryID исключаются по локальной истории за 5 дней.
    # Дополнительные параметры и local/rdp не нужны. Telegram настраивается в config.yaml.
