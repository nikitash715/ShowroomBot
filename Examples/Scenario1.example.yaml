# Скопируйте в Scenarios/Scenario1.yaml и заполните параметры своей базы.
# Файлы Scenarios/*.yaml исключены из Git, так как могут содержать пароли.
# Этот пример не загружается как рабочий сценарий из папки Examples.
name: "Сценарий 1"
steps:
  - type: Open1C
    executable: 'C:\Program Files\1cv8\common\1cestart.exe'
    server: 'onec.example.com'
    database: 'example_database'
    user: 'example_user'
    password: '' # Заполните только в локальной копии, если пароль необходим.
    typingDelayMs: 80
    afterActivationDelayMs: 1000
    afterRunDialogDelayMs: 500
    reuseExistingWindow: true
    panelColor: '#C0DCC0'
    colorTolerance: 8
    readyTimeoutSeconds: 60
    pollIntervalMs: 500
    windowSwitchDelayMs: 700
    maxWindowsToCheck: 50
  - type: Open1CCommand
    section: "Infostart Toolkit"
    command: "Консоль запросов"
    sectionOpenTimeoutSeconds: 5
    commandTimeoutSeconds: 15
