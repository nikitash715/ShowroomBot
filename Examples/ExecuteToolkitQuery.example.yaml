# Скопируйте в Scenarios и заполните параметры своей базы.
name: "Toolkit — Распределение запасов"
steps:
  - type: ExecuteToolkitQuery
    executable: 'C:\Program Files\1cv8\common\1cestart.exe'
    server: 'onec.example.com'
    database: 'example_database'
    user: 'example_user'
    password: ''
    queryFile: 'Queries/Queries1c/РаспределениеЗапасов.txt'
    queryInputMode: paste # typing — набор, paste — вставка через буфер обмена
    typingDelayMs: 10
    afterActivationDelayMs: 1000
    afterRunDialogDelayMs: 500
    panelColor: '#C0DCC0'
    readyTimeoutSeconds: 60
    consoleTimeoutSeconds: 30
    queryInputTimeoutSeconds: 20
    queryTimeoutSeconds: 120
    pollIntervalMs: 500
    resultStablePolls: 3
    scrollPauseMs: 700
    scrollNotches: 2
    scrollTimeoutSeconds: 50
    maxScrollAttempts: 300
    scrollUnchangedAttempts: 4
